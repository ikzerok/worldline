[package]
name = "worldline-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "worldline 机器协议入口:stdio JSON-RPC 服务,供外部 agent 程序驱动"

[dependencies]
worldline-core = { path = "../core" }
worldline-runtime = { path = "../runtime" }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "wl-agent"
path = "src/main.rs"

[lib]
name = "worldline_agent"
path = "src/lib.rs"
