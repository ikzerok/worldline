[package]
name = "cap07e-prototype"
version = "0.0.0"
edition = "2021"
publish = false

# Deliberately independent from the product workspace.
[workspace]

[features]
browser-rng = ["uuid/js"]

[dependencies]
docx-rs = { version = "=0.4.22", default-features = false }
epub-builder = { version = "=0.8.3", default-features = false, features = ["zip-library"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
uuid = { version = "=1.26.1", optional = true }
